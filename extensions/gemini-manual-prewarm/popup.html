<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemini Manual Prewarm</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Gemini 发送 / Redo 预热</h1>
          <p>仅在真实手动操作前运行</p>
        </div>
        <label class="switch" title="启用或停用">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section aria-live="polite">
        <div class="row"><span>状态</span><strong id="state">读取中…</strong></div>
        <div class="row"><span>最近动作</span><strong id="trigger">—</strong></div>
        <div class="row"><span>最近耗时</span><strong id="duration">—</strong></div>
        <div class="row"><span>发送动作</span><strong id="send-result">—</strong></div>
        <div class="row"><span>时间</span><strong id="time">—</strong></div>
      </section>

      <p class="privacy">不会读取或保存输入的提示文本。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
